spring.application.name=pantrypulse

# Web Server Port
server.port=8080

# XAMPP MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/pantrypulse?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (Auto-creates your tables!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# SMTP Email (Gmail) - Fill in your credentials
# =============================================
# To get an App Password: myaccount.google.com -> Security -> 2FA -> App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=noreply@pantrypulse.com

# App base URL (used in email verification links)
app.base-url=http://localhost:8080

# =============================================
# Google OAuth (fill in from Google Cloud Console)
