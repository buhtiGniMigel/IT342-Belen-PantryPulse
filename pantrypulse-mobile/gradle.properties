# Project-wide Gradle settings.
# Optimized for higher performance and speed during development.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin daemon - allocated for faster compilation
kotlin.daemon.jvm.options=-Xmx1024m -XX:+UseG1GC

# Build settings optimized for speed
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true